version: 2

models:
  - name: metrics_provider_performance
    description: |
      Provider revenue at 1 row per `fiscal_year_period`, `provider_department`, `provider_specialty`.
    columns:
      - name: provider_revenue_key
        description: Unique key for the table.
        data_tests:
          - not_null
          - unique
        data_type: text
      - name: fiscal_year
        description: The fiscal year associated with grain.
        data_type: text
      - name: fiscal_year_period
        description: The fiscal year period associated with grain.
        data_type: text
      - name: provider_department
        description: Name of provider department associated with grain.
        data_type: text
      - name: provider_specialty
        description: Name of provider specialty associated with grain.
        data_type: text
      - name: billed_units
        ddescription: Total amount in billed quantity associated with grain.
        data_type: numeric
      - name: total_charges
        description: Total amount in billed dollars associated with grain.
        data_type: numeric
      - name: _updated_at
        description: Datetime when last updated.
        data_type: timestamp_tz
